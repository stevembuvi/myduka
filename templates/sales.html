{% extends "base.html" %}

{% block title %}Sales Page{% endblock %}

{% block content %}

<div>
    <p>My Sales Page</p>

    <!-- Button trigger modal -->
    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
        Add Sales
    </button>

    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">

        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">
                        Adding Sales
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <form method="POST" action="/add_sales">

                        <div class="mb-3">
                            <label class="form-label">Select Product</label>

                            <select name="p_id" class="form-select" required>
                                <option value="">Choose Product</option>

                                {% for product in products_data %}
                                <option value="{{ product[0] }}">
                                    {{ product[1] }}
                                </option>
                                {% endfor %}

                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Sales Quantity</label>
                            <input type="number" name="s_quantity" class="form-control" min="1" required>
                        </div>

                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                Close
                            </button>

                            <button type="submit" name="a_sales" class="btn btn-primary">
                                Add Sales
                            </button>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- Sales Table -->
    <div>
        <table id="example" class="display">
            <thead>
                <tr>
                    <th>Sales ID</th>
                    <th>Product ID</th>
                    <th>Sales Quantity</th>
                    <th>Date Sold</th>
                </tr>
            </thead>

            <tbody>
                {% for sales in sales_data %}
                <tr>
                    <td>{{ sales[0] }}</td>
                    <td>{{ sales[1] }}</td>
                    <td>{{ sales[2] }}</td>
                    <td>{{ sales[3] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</div>

{% endblock %}
